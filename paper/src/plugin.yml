name: Hematite
version: 0.1.0
main: dev.hematite.HematitePlugin
api-version: '26.3'
load: STARTUP
description: Faster world generation, block for block identical to vanilla. Terrain and biomes in Rust, faster ore veins, look-ahead for fast flyers.
commands:
  hematite:
    description: Toggle the Hematite action bar and show generation totals, or simulate players flying
    permission: hematite.admin
    usage: "/hematite, or /hematite fly <blocks/s> <seconds> [view distance] [players] [on|off look-ahead]"
permissions:
  hematite.admin:
    description: The action bar and /hematite
    default: op
