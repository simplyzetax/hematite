[package]
name = "hematite"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.10"
md-5 = "0.11.0"
rayon = "1.12.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = "9.1.2"
zstd = "0.14.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# Library for the Paper plugin: same as release, but a panic unwinds so the plugin can fall back to vanilla.
[profile.plugin]
inherits = "release"
panic = "unwind"
